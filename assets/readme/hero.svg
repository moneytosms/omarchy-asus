<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">omarchy-asus</title>
  <desc id="d">omarchy-asus, a tabbed ASUS laptop control panel for the Omarchy bar. A panel mock shows four tabs (Main, RGB, Fan, Advanced) and live CPU, GPU, battery and GPU power readings.</desc>
  <rect width="1200" height="400" rx="26" fill="#0d0d0d"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="25.5" fill="none" stroke="#2a2a2a"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <g transform="translate(64 64)">
      <text font-size="16" letter-spacing="3" fill="#7a7a7a">OMARCHY BAR PLUGIN · ASUSCTL</text>
      <text y="92" font-size="76" font-weight="700" fill="#e8e8e8" letter-spacing="-3">omarchy-asus</text>
      <text y="150" font-size="26" fill="#a8a8a8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">G-Helper-style control for your ASUS laptop.</text>
      <text y="188" font-size="26" fill="#a8a8a8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Shows only what your model supports.</text>
      <g transform="translate(0 226)" font-size="16">
        <rect width="120" height="36" rx="4" fill="#161616" stroke="#2a2a2a"/><text x="60" y="24" text-anchor="middle" fill="#e8e8e8">Power</text>
        <rect x="132" width="64" height="36" rx="4" fill="#161616" stroke="#2a2a2a"/><text x="164" y="24" text-anchor="middle" fill="#e8e8e8">RGB</text>
        <rect x="208" width="64" height="36" rx="4" fill="#161616" stroke="#2a2a2a"/><text x="240" y="24" text-anchor="middle" fill="#e8e8e8">Fan</text>
        <rect x="284" width="104" height="36" rx="4" fill="#161616" stroke="#2a2a2a"/><text x="336" y="24" text-anchor="middle" fill="#e8e8e8">Limits</text>
      </g>
      <text y="316" font-size="15" fill="#7a7a7a">QML · Arch · ROG / TUF / ProArt / Zenbook</text>
    </g>
    <g transform="translate(700 44)">
      <rect width="440" height="312" rx="12" fill="#101010" stroke="#2a2a2a"/>
      <g font-size="15" text-anchor="middle" fill="#e8e8e8">
        <rect x="20" y="20" width="92" height="34" rx="3" fill="#2a2a2a" stroke="#3a3a3a"/><text x="66" y="42">Main</text>
        <rect x="124" y="20" width="92" height="34" rx="3" fill="#0a0a0a" stroke="#2a2a2a"/><text x="170" y="42">RGB</text>
        <rect x="228" y="20" width="92" height="34" rx="3" fill="#0a0a0a" stroke="#2a2a2a"/><text x="274" y="42">Fan</text>
        <rect x="332" y="20" width="88" height="34" rx="3" fill="#0a0a0a" stroke="#2a2a2a"/><text x="376" y="42">Advanced</text>
      </g>
      <g text-anchor="middle">
        <rect x="20" y="74" width="195" height="76" rx="3" fill="#181818"/>
        <text x="117" y="96" font-size="13" fill="#7a7a7a">CPU</text><text x="117" y="124" font-size="26" font-weight="700" fill="#44cc44">59°C</text><text x="117" y="142" font-size="12" fill="#a8a8a8">2500 rpm</text>
        <rect x="225" y="74" width="195" height="76" rx="3" fill="#181818"/>
        <text x="322" y="96" font-size="13" fill="#7a7a7a">GPU</text><text x="322" y="124" font-size="26" font-weight="700" fill="#44cc44">51°C</text><text x="322" y="142" font-size="12" fill="#a8a8a8">2800 rpm</text>
        <rect x="20" y="158" width="195" height="76" rx="3" fill="#181818"/>
        <text x="117" y="180" font-size="13" fill="#7a7a7a">BATTERY</text><text x="117" y="208" font-size="26" font-weight="700" fill="#e8e8e8">79%</text><text x="117" y="226" font-size="12" fill="#a8a8a8">Charging</text>
        <rect x="225" y="158" width="195" height="76" rx="3" fill="#181818"/>
        <text x="322" y="180" font-size="13" fill="#7a7a7a">GPU POWER</text><text x="322" y="208" font-size="26" font-weight="700" fill="#e8e8e8">14 W</text><text x="322" y="226" font-size="12" fill="#a8a8a8">boost 25W</text>
      </g>
      <g font-size="14" text-anchor="middle">
        <rect x="20" y="254" width="125" height="34" rx="3" fill="#0a0a0a" stroke="#2a2a2a"/><text x="82" y="276" fill="#e8e8e8">Quiet</text>
        <rect x="157" y="254" width="125" height="34" rx="3" fill="#0a0a0a" stroke="#2a2a2a"/><text x="219" y="276" fill="#e8e8e8">Balanced</text>
        <rect x="294" y="254" width="126" height="34" rx="3" fill="#2a2a2a" stroke="#3a3a3a"/><text x="357" y="276" fill="#ff6a55">Performance</text>
      </g>
    </g>
    <text x="1140" y="384" text-anchor="end" font-size="12" fill="#5a5a5a">mock of the Main tab · real screenshots below</text>
  </g>
</svg>
